<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>TOOKIE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B1020; color: #E8ECF6; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem 1.5rem; text-align: center; box-sizing: border-box; }
  img { width: 9rem; height: 9rem; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
  p { margin: 0; max-width: 22rem; line-height: 1.6; font-size: .95rem; color: #AEB7CC; }
  .bar { width: 11rem; height: .3rem; border-radius: 1rem; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 1rem; background: #6EA8FE; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
  .acts { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  button { min-height: 2.75rem; padding: 0 1.25rem; border-radius: .75rem; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: inherit; font: inherit; }
  button.main { background: #3B6FD9; border-color: #3B6FD9; color: #fff; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .6; } }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="" width="144" height="144">
  <h1>TOOKIE</h1>
  <div class="bar" id="bar" role="progressbar" aria-busy="true"><i></i></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div class="acts" id="acts" hidden>
    <button class="main" id="retry" type="button"></button>
    <button id="open" type="button"></button>
  </div>
</main>
<script>
/* Render の無料プランは、しばらく使われないと止まり、最初の1回は起動に1分ほどかかる。
   その間、白い画面のままにならないよう、先にこの画面を出して、起きるのを待ってから本体のサイトへ移る。 */
(function () {
  var TARGET = "https://tookie-translator.onrender.com/";
  var PING = TARGET + "healthz";
  var SLOW_MS = 25000, GIVEUP_MS = 100000, TRY_MS = 8000, GAP_MS = 3000;
  var T = {
    ja: { wake: "サーバーを起こしています。最初の1回は、1分ほどかかることがあります。", slow: "もう少しかかっています。このままお待ちください。", fail: "つながりにくい状態です。もう一度試すか、そのまま開いてください。", retry: "もう一度", open: "そのまま開く" },
    en: { wake: "Waking up the server. The first start can take about a minute.", slow: "Still working. Please keep waiting.", fail: "The connection is slow. Try again, or open the app anyway.", retry: "Try again", open: "Open anyway" }
  };
  var lang = /^ja/i.test(navigator.language || "") ? "ja" : "en";
  var tx = T[lang];
  document.documentElement.lang = lang;
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), acts = $("acts"), bar = $("bar");
  var started = 0, timer = 0, gone = false;

  function go() { if (gone) return; gone = true; location.replace(TARGET); }
  function goOffline() { if (gone) return; gone = true; location.replace(TARGET + "offline"); }   // 電波がないとき: 本体のサイトが端末に保存してあるオフライン画面（前に一度、通信できるときに開いておく）
  function say(t) { msg.textContent = t; }
  function giveUp() {
    clearTimeout(timer); say(tx.fail); acts.hidden = false; bar.hidden = true; bar.setAttribute("aria-busy", "false");
  }
  function ping() {   // 本体の /healthz が「ok」と答えれば、起きている（Render の「起動中」の仮ページは ok ではない）
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, TRY_MS);
    return fetch(PING, { mode: "cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) { clearTimeout(to); return t.trim() === "ok"; })
      .catch(function () { clearTimeout(to); return false; });
  }
  function loop() {
    if (gone) return;
    if (navigator.onLine === false) { goOffline(); return; }   // 電波がないときは、保存済みの画面（オフライン）へ
    var spent = Date.now() - started;
    if (spent > SLOW_MS) say(tx.slow);
    ping().then(function (ok) {
      if (ok) { go(); return; }
      if (navigator.onLine === false) { goOffline(); return; }
      if (Date.now() - started > GIVEUP_MS) { giveUp(); return; }
      timer = setTimeout(loop, GAP_MS);
    });
  }
  function start() {
    started = Date.now(); acts.hidden = true; bar.hidden = false; bar.setAttribute("aria-busy", "true");
    say(tx.wake); clearTimeout(timer); loop();
  }
  $("retry").textContent = tx.retry; $("open").textContent = tx.open;
  $("retry").addEventListener("click", start);
  $("open").addEventListener("click", go);
  window.addEventListener("online", function () { if (!gone && acts.hidden) { clearTimeout(timer); loop(); } });
  start();
})();
</script>
</body>
</html>
