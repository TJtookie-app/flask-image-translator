services:
  - type: web
    name: flask-image-translator-docker
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      # 以下は任意（既定値のままでOK）
      # - GEMINI_TEXT_TIMEOUT=25 / GEMINI_TIMEOUT=40 / GEMINI_ATTEMPTS=2 / GEMINI_THINKING_LEVEL=low
      # - RATES_TTL_SEC=21600（通貨タブの為替レートの保存時間。既定のままでOK）
      # - RATE_PER_MIN=20 / DAILY_LIMIT_PER_IP=300 / SITE_DAILY_LIMIT=16（無料枠の場合）
      # - SITE_RATE_PER_MIN=4（無料枠は1モデル1分5回） / TRUSTED_PROXY_HOPS=0
      # - LIMIT_DAY_TZ=America/Los_Angeles（既定。1日の区切り＝Googleの無料枠が戻る時刻） / QUOTA_SHOW_BELOW=500（上限がこれ以下のとき残り回数を表示）
      # - ADMIN_TOKEN=（設定すると /api/stats?token=... で集計を見られる）
      # - KEEP_ALIVE_URL=https://<自分のURL>/healthz
