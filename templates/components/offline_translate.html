<!-- オフライン画面のテキスト翻訳（v1.9.1）: 設定でダウンロードしたモデルで、通信なしで訳す。動きは static/js/offline_mt_tab.js -->
<div class="page-title"><span class="pt-ico" aria-hidden="true"><i class="fa-solid fa-pen-to-square"></i></span><h2 class="pt-text" dir="auto">{{ ui.nav_text }}</h2></div>
<div id="omt-tab" class="space-y-3">
    <p class="text-xs text-slate-400 leading-relaxed">{{ ui.ot_hint }}</p>
    <!-- 言語のバー: オンラインの画面と同じ形（翻訳元 ⇄ 翻訳先）。圏外で使えるのは日本語⇄英語だけなので、真ん中の矢印で入れ替える -->
    <div id="omt-tab-bar" class="flex items-end justify-between gap-2 w-full">
        <div class="flex-1 min-w-0">
            <span class="text-xs text-slate-400 block mb-1 font-semibold text-center truncate">{{ ui.source_label }}</span>
            <div id="omt-tab-from" class="w-full bg-slate-800/80 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-center font-medium shadow-sm text-sm truncate"></div>
        </div>
        <button type="button" id="omt-tab-swap" aria-label="swap" class="flex-shrink-0 w-11 h-11 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-indigo-400 hover:text-indigo-300 rounded-full border border-slate-700 transition shadow-sm"><i class="fa-solid fa-arrow-right-arrow-left text-xs"></i></button>
        <div class="flex-1 min-w-0">
            <span class="text-xs text-indigo-400 block mb-1 font-semibold text-center truncate">{{ ui.target_label }}</span>
            <div id="omt-tab-to" class="w-full bg-slate-800/80 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-center font-medium shadow-sm text-sm truncate"></div>
        </div>
    </div>
    <textarea id="omt-tab-in" rows="4" maxlength="2000" placeholder="{{ ui.ot_ph }}" class="w-full rounded-xl border border-slate-700 bg-transparent text-sm text-slate-100 p-2.5"></textarea>
    <div id="omt-tab-need" class="hidden rounded-xl bg-amber-950/30 border border-amber-900/60 p-2.5 space-y-2">
        <p class="text-xs text-amber-200 leading-relaxed">{{ ui.ot_need }}</p>
        <button type="button" id="omt-tab-open" class="w-full min-h-[2.75rem] bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl py-2 transition"><i class="fa-solid fa-gear"></i> {{ ui.ot_open }}</button>
    </div>
    <button type="button" id="omt-tab-run" class="w-full min-h-[2.75rem] bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl py-2 transition disabled:opacity-50"><i class="fa-solid fa-language"></i> {{ ui.ot_run }}</button>
    <div id="omt-tab-result" class="hidden rounded-xl border border-slate-700/70 p-2.5 space-y-2">
        <p id="omt-tab-label" class="text-xs text-slate-400"></p>
        <p id="omt-tab-out" class="text-sm text-slate-100 whitespace-pre-wrap break-words" dir="auto"></p>
        <button type="button" id="omt-tab-copy" class="min-h-[2.75rem] px-3 text-xs text-slate-300 border border-slate-700 rounded-xl"><i class="fa-solid fa-copy"></i> <span>{{ ui.copy_btn }}</span></button>
    </div>
    <p id="omt-tab-err" class="hidden text-xs text-red-300">{{ ui.ot_err }}</p>
</div>
