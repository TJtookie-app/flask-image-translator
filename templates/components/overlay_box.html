{# 画像の上に訳文を重ねて見せる枠（画像タブ=overlay、カメラタブ=ovc）。操作ボタン: 重ね表示の切り替え・一覧・拡大・画像で保存 #}
{% macro overlay_box(p) %}
<div id="{{ p }}-box" class="hidden w-full mt-3 space-y-2 text-left">
    <div id="{{ p }}-stage" class="ov-stage relative w-full rounded-2xl overflow-hidden border border-slate-800 bg-black">
        <img id="{{ p }}-img" class="block w-full h-auto" alt="">
        <div id="{{ p }}-layer" class="ov-layer absolute inset-0"></div>
    </div>
    <p class="text-xs text-slate-400">{{ ui.ov_pick_hint }}</p>
    <div class="ov-tools">
        <button type="button" id="{{ p }}-toggle" onclick="ovAction('{{ p }}', 'toggle')" class="ov-tool ov-tool-main"></button>
        <button type="button" id="{{ p }}-selbtn" onclick="ovAction('{{ p }}', 'select')" class="ov-tool"></button>
        <button type="button" id="{{ p }}-copy" onclick="ovAction('{{ p }}', 'copy')" class="ov-tool">{{ ui.copy_btn }}</button>
        <button type="button" id="{{ p }}-zoom" onclick="ovAction('{{ p }}', 'zoom')" class="ov-tool"><i class="fa-solid fa-magnifying-glass-plus"></i><span>{{ ui.ov_zoom }}</span></button>
        <button type="button" id="{{ p }}-save" onclick="ovAction('{{ p }}', 'save')" class="ov-tool"><i class="fa-solid fa-download"></i><span class="ov-save-label">{{ ui.ov_save }}</span></button>
    </div>
    <div id="{{ p }}-list" class="space-y-1.5 text-left"></div>
</div>
{% endmacro %}
