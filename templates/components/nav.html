<!-- 下部ナビゲーション（画面の下に固定。右端が設定（中に履歴・お気に入り・用語集など）、右から2番目が通貨。内部の名前は tab-history / nav-history のまま） -->
<nav id="bottom-nav" class="bottom-nav" aria-label="TOOKIE">
    <div class="bottom-nav-in">
        {% for tab, icon in [('text','fa-pen-to-square'),('image','fa-image'),('voice','fa-microphone'),('camera','fa-camera'),('conversation','fa-comments'),('money','fa-coins'),('history','fa-gear')] %}
        <button type="button" onclick="switchTab('{{ tab }}')" id="nav-{{ tab }}" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl transition min-w-0">
            <i class="fa-solid {{ icon }} text-base mb-1"></i>
            <span class="text-[11px] font-medium truncate max-w-full">{{ ui.filter_settings if tab == 'history' else ui['nav_' ~ tab] }}</span>
        </button>
        {% endfor %}
    </div>
</nav>
